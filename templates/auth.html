{% extends 'base.html' %}
{% block content %}
<div class="grid-2" style="max-width: 800px; margin: 40px auto;">
    <div class="card">
        <h2>Sign In</h2>
        <form action="{{ url_for('main.login') }}" method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Access Platform</button>
        </form>
    </div>
    <div class="card">
        <h2>Create Account</h2>
        <form action="{{ url_for('main.register') }}" method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="text" name="referred_by" placeholder="Referral Code (Optional)">
            <button type="submit" style="background:var(--success);">Register</button>
        </form>
    </div>
</div>
{% endblock %}
